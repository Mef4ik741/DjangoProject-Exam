{% extends 'base.html' %}

{% block title %}Удалить статью{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-body">
            <h1 class="card-title">Удалить статью</h1>
            <p>Вы уверены, что хотите удалить статью <strong>"{{ article.title }}"</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Удалить</button>
                <a href="{% url 'article_detail' article.pk %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
{% endblock %}
